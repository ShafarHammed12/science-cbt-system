<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - Science CBT System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>🔬 Science CBT</h2>
        <p>E-Learning System</p>
      </div>
      <ul class="nav-menu">
        <li><a href="dashboard.html" class="active"><span class="icon">🏠</span> Dashboard</a></li>
        <li><a href="topics.html"><span class="icon">📚</span> Topics</a></li>
        <li><a href="my-results.html"><span class="icon">📊</span> My Results</a></li>
        <li><a href="my-progress.html"><span class="icon">📈</span> My Progress</a></li>
      </ul>
      <div class="sidebar-footer">
        <div class="user-info">
          <strong id="userName"></strong>
          <span id="userClass"></span>
        </div>
        <button class="btn btn-danger btn-sm btn-block" onclick="logout()">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1>Welcome, <span id="welcomeName"></span>!</h1>
      </div>

      <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
          <div class="stat-icon">📚</div>
          <div class="stat-value" id="topicCount">0</div>
          <div class="stat-label">Available Topics</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📝</div>
          <div class="stat-value" id="testCount">0</div>
          <div class="stat-label">Tests Taken</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⭐</div>
          <div class="stat-value" id="avgScore">0%</div>
          <div class="stat-label">Average Score</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">✅</div>
          <div class="stat-value" id="lessonsDone">0</div>
          <div class="stat-label">Lessons Completed</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Recent Test Results</h3>
          <a href="my-results.html" class="btn btn-outline btn-sm">View All</a>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Topic</th>
                <th>Score</th>
                <th>Questions</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="recentResults">
              <tr><td colspan="4" class="text-center">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
