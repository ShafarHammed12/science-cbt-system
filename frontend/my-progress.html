<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Progress - Science CBT System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>🔬 Science CBT</h2>
        <p>E-Learning System</p>
      </div>
      <ul class="nav-menu">
        <li><a href="dashboard.html"><span class="icon">🏠</span> Dashboard</a></li>
        <li><a href="topics.html"><span class="icon">📚</span> Topics</a></li>
        <li><a href="my-results.html"><span class="icon">📊</span> My Results</a></li>
        <li><a href="my-progress.html" class="active"><span class="icon">📈</span> My Progress</a></li>
      </ul>
      <div class="sidebar-footer">
        <div class="user-info">
          <strong id="userName"></strong>
          <span id="userClass"></span>
        </div>
        <button class="btn btn-danger btn-sm btn-block" onclick="logout()">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1>📈 My Progress</h1>
      </div>

      <div class="card mb-20">
        <div class="card-header">
          <h3>Overall Progress</h3>
        </div>
        <div id="overallProgress">
          <div class="flex justify-between items-center mb-10">
            <span>Lessons Completed</span>
            <strong id="overallText">0/0</strong>
          </div>
          <div class="progress-bar" style="height: 12px;">
            <div class="progress-fill" id="overallFill" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Completed Lessons</h3>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Lesson</th>
                <th>Topic</th>
                <th>Completed On</th>
              </tr>
            </thead>
            <tbody id="progressTable">
              <tr><td colspan="3" class="text-center">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireAuth()) return;
      const user = getUser();
      document.getElementById('userName').textContent = user.fullName;
      document.getElementById('userClass').textContent = user.className;

      try {
        const [progress, report] = await Promise.all([
          apiRequest('/progress/my'),
          apiRequest('/reports/my')
        ]);

        document.getElementById('overallText').textContent = `${report.completedLessons}/${report.totalLessons}`;
        document.getElementById('overallFill').style.width = report.lessonProgress + '%';

        const tbody = document.getElementById('progressTable');
        if (progress.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" class="text-center">No lessons completed yet. Start learning!</td></tr>';
        } else {
          tbody.innerHTML = progress.map(p => `
            <tr>
              <td>${p.lesson ? p.lesson.title : 'N/A'}</td>
              <td>${p.lesson && p.lesson.topic ? p.lesson.topic.title : 'N/A'}</td>
              <td>${p.completedAt ? formatDate(p.completedAt) : '--'}</td>
            </tr>
          `).join('');
        }
      } catch (error) {
        console.error('Progress load error:', error);
      }
    });
  </script>
</body>
</html>
