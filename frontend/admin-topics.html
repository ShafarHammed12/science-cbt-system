<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Topics - Science CBT System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>🔬 Science CBT</h2>
        <p>Admin Panel</p>
      </div>
      <ul class="nav-menu">
        <li><a href="admin-dashboard.html"><span class="icon">🏠</span> Dashboard</a></li>
        <li><a href="admin-topics.html" class="active"><span class="icon">📚</span> Manage Topics</a></li>
        <li><a href="admin-lessons.html"><span class="icon">📖</span> Manage Lessons</a></li>
        <li><a href="admin-questions.html"><span class="icon">❓</span> Manage Questions</a></li>
        <li><a href="admin-results.html"><span class="icon">📊</span> All Results</a></li>
        <li><a href="admin-reports.html"><span class="icon">📋</span> Reports</a></li>
      </ul>
      <div class="sidebar-footer">
        <div class="user-info">
          <strong id="userName"></strong>
          <span>Administrator</span>
        </div>
        <button class="btn btn-danger btn-sm btn-block" onclick="logout()">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1>📚 Manage Topics</h1>
        <button class="btn btn-primary" onclick="openModal()">+ Add Topic</button>
      </div>

      <div id="alert" class="alert"></div>

      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Class</th>
                <th>Description</th>
                <th>Order</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="topicsTable">
              <tr><td colspan="5" class="text-center">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="topicModal">
    <div class="modal">
      <h2 id="modalTitle">Add Topic</h2>
      <form id="topicForm">
        <input type="hidden" id="topicId">
        <div class="form-group">
          <label for="title">Topic Title</label>
          <input type="text" id="title" required placeholder="e.g., Living Things">
        </div>
        <div class="form-group">
          <label for="className">Class</label>
          <select id="className" required>
            <option value="JSS1">JSS 1</option>
            <option value="JSS2">JSS 2</option>
            <option value="JSS3">JSS 3</option>
          </select>
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="3" placeholder="Brief description of the topic"></textarea>
        </div>
        <div class="form-group">
          <label for="order">Display Order</label>
          <input type="number" id="order" value="0" min="0">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Topic</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    let topics = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!requireAuth() || !requireAdmin()) return;
      document.getElementById('userName').textContent = getUser().fullName;
      loadTopics();

      document.getElementById('topicForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('topicId').value;
        const data = {
          title: document.getElementById('title').value,
          className: document.getElementById('className').value,
          description: document.getElementById('description').value,
          order: parseInt(document.getElementById('order').value) || 0
        };

        try {
          if (id) {
            await apiRequest(`/topics/${id}`, { method: 'PUT', body: JSON.stringify(data) });
            showAlert('alert', 'Topic updated successfully!', 'success');
          } else {
            await apiRequest('/topics', { method: 'POST', body: JSON.stringify(data) });
            showAlert('alert', 'Topic created successfully!', 'success');
          }
          closeModal();
          loadTopics();
        } catch (error) {
          alert('Error: ' + error.message);
        }
      });
    });

    async function loadTopics() {
      try {
        topics = await apiRequest('/topics');
        const tbody = document.getElementById('topicsTable');
        if (topics.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center">No topics yet. Click "Add Topic" to create one.</td></tr>';
        } else {
          tbody.innerHTML = topics.map(t => `
            <tr>
              <td><strong>${t.title}</strong></td>
              <td><span class="badge badge-primary">${t.className}</span></td>
              <td>${t.description || '--'}</td>
              <td>${t.order}</td>
              <td>
                <button class="btn btn-sm btn-outline" onclick="editTopic('${t._id}')">Edit</button>
                <button class="btn btn-sm btn-danger" onclick="deleteTopic('${t._id}')">Delete</button>
              </td>
            </tr>
          `).join('');
        }
      } catch (error) {
        console.error('Load topics error:', error);
      }
    }

    function openModal(topic) {
      document.getElementById('topicModal').classList.add('active');
      if (topic) {
        document.getElementById('modalTitle').textContent = 'Edit Topic';
        document.getElementById('topicId').value = topic._id;
        document.getElementById('title').value = topic.title;
        document.getElementById('className').value = topic.className;
        document.getElementById('description').value = topic.description || '';
        document.getElementById('order').value = topic.order || 0;
      } else {
        document.getElementById('modalTitle').textContent = 'Add Topic';
        document.getElementById('topicForm').reset();
        document.getElementById('topicId').value = '';
      }
    }

    function closeModal() {
      document.getElementById('topicModal').classList.remove('active');
    }

    function editTopic(id) {
      const topic = topics.find(t => t._id === id);
      if (topic) openModal(topic);
    }

    async function deleteTopic(id) {
      if (!confirm('Are you sure you want to delete this topic? All related lessons, questions, and results may be affected.')) return;
      try {
        await apiRequest(`/topics/${id}`, { method: 'DELETE' });
        showAlert('alert', 'Topic deleted successfully!', 'success');
        loadTopics();
      } catch (error) {
        alert('Error: ' + error.message);
      }
    }
  </script>
</body>
</html>
